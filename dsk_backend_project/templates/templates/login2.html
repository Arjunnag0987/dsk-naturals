<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | DSK Naturals</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-green-100 to-green-50 min-h-screen flex items-center justify-center">

    <div class="bg-white shadow-xl rounded-2xl w-full max-w-md p-8">

        <!-- Title -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-green-700">DSK Naturals</h1>
            <p class="text-gray-500 text-sm mt-1">Login to your account</p>
        </div>

        <!-- Login Form -->
        <form method="POST" action="/login/" class="space-y-4">
            {% csrf_token %}

            {% if messages %}
                <div class="mb-4 space-y-2">
                    {% for message in messages %}
                    <div
                        class="px-4 py-2 rounded text-white text-sm
                        {% if message.tags == 'success' %} bg-green-600
                        {% elif message.tags == 'error' %} bg-red-600
                        {% else %} bg-gray-600 {% endif %}">
                        {{ message }}
                    </div>
                    {% endfor %}
                </div>
                {% endif %}

            <div>
                <label class="block text-sm">Username</label>
                <input type="text" name="username" required
                    class="w-full border px-3 py-2 rounded">
            </div>

            <div>
                <label class="block text-sm">Password</label>
                <input type="password" name="password" required
                    class="w-full border px-3 py-2 rounded">
            </div>

            <button type="submit"
                    class="w-full bg-green-700 text-white py-2 rounded">
                Login
            </button>
        </form>


        <!-- Footer -->
        <p class="text-center text-sm text-gray-600 mt-6">
            Don’t have an account?
            <a href="/register/" class="text-green-700 font-semibold hover:underline">
                Create one
            </a>
        </p>

    </div>

</body>
</html>
